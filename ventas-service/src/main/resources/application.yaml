spring:
  application:
    name: ferrestock-ventas

  # Lee DB_URL / DB_USER / DB_PASSWORD desde ventas-service/.env (si existe). Ver .env.example.
  config:
    import: optional:file:.env[.properties]

  datasource:
    # Credenciales por variables de entorno: DB_URL, DB_USER, DB_PASSWORD.
    # Los defaults son solo para desarrollo local; la contraseña NO tiene default (definir DB_PASSWORD).
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=ferrestock_ventas;encrypt=true;trustServerCertificate=true}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

server:
  port: ${PORT:8080}
